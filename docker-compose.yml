name: miet-tv

services:
  booking-db:
    image: postgres:16-alpine
    container_name: booking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - booking-pgdata:/var/lib/postgresql/data
    networks:
      - booking-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  booking-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miet-tv-migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      booking-db:
        condition: service_healthy
    networks:
      - booking-net
    restart: "no"

  booking-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miet-tv-api
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      MEDIA_DIR: /data/uploads
    volumes:
      - booking-media:/data/uploads
    depends_on:
      booking-db:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
    networks:
      - booking-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  booking-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miet-tv-bot
    command: ["python", "-m", "app.main"]
    env_file:
      - .env
    depends_on:
      booking-db:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
    networks:
      - booking-net
    restart: unless-stopped

  booking-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: miet-tv-web
    ports:
      - "9443:9443"
    volumes:
      - /root/.acme.sh/31.77.160.59_ecc/fullchain.cer:/etc/nginx/certs/fullchain.cer:ro
      - /root/.acme.sh/31.77.160.59_ecc/31.77.160.59.key:/etc/nginx/certs/31.77.160.59.key:ro
    depends_on:
      booking-api:
        condition: service_healthy
    networks:
      - booking-net
    restart: unless-stopped

volumes:
  booking-pgdata:
  booking-media:

networks:
  booking-net:
    driver: bridge
